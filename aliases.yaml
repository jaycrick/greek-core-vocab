# Title aliases for match_books.py.
#
# Most great_books.tsv titles match a vocab.perseus.org work automatically
# once both sides are normalized (lowercased, a leading "the"/"a"/"an"
# stripped, trailing punctuation stripped) and compared for equality, or
# as an exact match against one comma-separated component of a Perseus
# title that covers several works at once.
#
# These pairs don't share a normalized-equal string -- different English
# renderings, an English GBWW title against vocab.perseus.org's Latin
# title (most of Hippocrates and about half of Aristotle are catalogued
# in Latin, not English), or a genuinely different conventional name.
# Each entry replaces the search title used for matching (still scoped
# to the same author) for one specific great_books.tsv row; it does not
# change what's displayed anywhere. Keyed by (author, gbww_title) so an
# alias never accidentally fires for a different author's same-named
# work.
#
# match_books.py only accepts an EXACT normalized match (or a
# comma-component match) for an alias-driven search, never word-
# subsequence containment -- see its own docstring/comment for why:
# several of these Latin titles would otherwise also catch an unrelated
# work that happens to share a short Latin phrase (Hippocrates' "De
# diaeta in morbis acutis" contains the separate treatise "De diaeta";
# Aristotle's "Physica" contains the alternate-recension "Physica
# (textus alter)"). Every target below is copied verbatim from
# vocab.perseus.org's own title string, so exact equality is enough.

aliases:
  - author: Aeschylus
    gbww_title: Choephoroe
    perseus_title: Libation Bearers
  - author: Sophocles
    gbww_title: Oedipus the King
    perseus_title: Oedipus Tyrannus
  - author: Euripides
    gbww_title: Bacchantes
    perseus_title: Bacchae
  - author: Euripides
    gbww_title: Heracles Mad
    perseus_title: Heracles
  - author: Herodotus
    gbww_title: The History
    perseus_title: The Histories
  - author: Aristophanes
    gbww_title: Ecclesiazousae
    perseus_title: Ecclesiazusae

  # Hippocrates: all 17 great_books.tsv treatises now have their own
