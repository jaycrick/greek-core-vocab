# Ground-truth overrides for match_books.py: great_books.tsv rows that
# should be counted from greek-learner-texts/vocabulary-corpus-prep's
# gold per-work lemma tagging (cloned locally to $CORPUS_REPO, default
# ~/git_repos/vocabulary-corpus-prep) instead of -- or in addition to --
# Perseus's Greek Vocabulary Tool. See README.md for the full reasoning
# (Perseus's own lemma inventory has real gaps -- e.g. no simplex
# a)fi/sthmi, no Swkra/ths at all -- and offers Plato only as
# multi-dialogue omnibus volumes, never single dialogues).
#
# Checked by match_books.py BEFORE overrides.yaml/aliases.yaml/general
# matching. A matching row gets matched_urns: [] (never fetched from
# Perseus) plus corpus_work_id, pointing at
# $CORPUS_REPO/one/<work_id>/lemma.tsv (built by corpus_vocab.py).
#
# `displaces_urns`: Perseus URNs this corpus work fully or partly
# duplicates. The *union* of every row's displaces_urns is subtracted
# from every OTHER row's matched_urns after normal matching runs --
# never silently: match_books.py records what got displaced and why on
# the row(s) that would otherwise have used it. Two outcomes:
#   - the URN carries only duplicated content -> dropped entirely
#     (Thucydides 1999.01.0199, Republic-only 1999.01.0167)
#   - the URN carries some content the corpus doesn't have (a Plato
#     dialogue not in the corpus's 5) -> KEPT, but combine.py scales
#     its weightedFrequency down by the duplicated proportion (see
#     `overlaps` below and README.md's overlap-accounting table)

corpus_works:
  - author: Thucydides
    gbww_title: History of the Peloponnesian War
    work_id: tlg0003.tlg001
    coverage: >
      Corpus has Books 1-5 only (gold-tagged). Perseus's
      1999.01.0199 covers all 8 books but is dropped outright, so
      Books 6-8 (including the Sicilian Expedition) are NOT
      represented anywhere in the master list. Accepted tradeoff --
      see README.md.
    displaces_urns: ["Perseus:text:1999.01.0199"]

  - author: Plato
    gbww_title: The Republic
    work_id: tlg0059.tlg030
    displaces_urns: ["Perseus:text:1999.01.0167"]

  - author: Plato
    gbww_title: Euthyphro
    work_id: tlg0059.tlg001
    displaces_urns: []

  - author: Plato
    gbww_title: Apology
    work_id: tlg0059.tlg002
    displaces_urns: []

  - author: Plato
    gbww_title: Crito
    work_id: tlg0059.tlg003
    displaces_urns: []

  - author: Plato
    gbww_title: Symposium
    work_id: tlg0059.tlg011
    displaces_urns: []

# Perseus volumes KEPT (not displaced) because they carry GBWW
# dialogues the corpus doesn't cover, but PARTLY duplicated by a
# corpus_works entry above. combine.py computes each `scale` at run
# time from data/corpus_counts.json + the volume's own summed
# weightedFrequency (see README.md's overlap-accounting table for the
# numbers this produces) -- nothing here is a hardcoded factor, only
# which lemma.tsv token counts to treat as the duplicated portion.
overlaps:
  - urn: "Perseus:text:1999.01.0169"
    contents: Euthyphro, Apology, Crito, Phaedo
    duplicated_by: [tlg0059.tlg001, tlg0059.tlg002, tlg0059.tlg003]
    reason: >
      Phaedo has no other source in this pipeline; keep the volume
      for Phaedo's sake, scale down the Euthyphro/Apology/Crito
      portion it also (redundantly) contains.

  - urn: "Perseus:text:1999.01.0173"
    contents: Parmenides, Philebus, Symposium, Phaedrus
    duplicated_by: [tlg0059.tlg011]
    reason: >
      Parmenides, Philebus and Phaedrus have no other source; keep
      the volume for their sake, scale down the Symposium portion.
