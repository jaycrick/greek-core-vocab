# Manual overrides for match_books.py -- great_books.tsv rows that need
# a human-picked, exact list of CTS URNs rather than the general
# normalize+equality+alias matching match_books.py otherwise does on
# its own.
#
# Keyed by (author, gbww_title); each entry's `urns` list is used
# VERBATIM as that row's matched_urns, bypassing normal matching
# entirely -- match_books.py checks this file first.

overrides:
  - author: Plutarch
    gbww_title: The Lives of the Noble Grecians and Romans
    reason: >
      GBWW's row is a single title for the whole Parallel Lives
      collection. vocab.perseus.org's Plutarch catalog (tlg0007) has
      only 22 editions total, of which 16 are individual Lives and 6
      are Perrin's own "Comparison of X and Y" essays -- excluded, not
      part of the Lives themselves. Crucially, 13 of those 22 editions
      carry no title metadata at all (the site itself renders them as
      "unknown" -- confirmed live, not a scraping gap), so title
      matching cannot reach them; each was instead identified by
      fetching its Scaife reader page (/rr/<urn>/), whose <title> gives
      the work's real Greek name (e.g. tlg0007.tlg002 -> Ῥωμύλος,
      Romulus). This is a real drop from the old hopper's ~50
      individually-fetchable Lives to 16 -- see README.md's
      coverage-regression table.
    urns:
      - "urn:cts:greekLit:tlg0007.tlg001.perseus-grc2"  # Theseus
      - "urn:cts:greekLit:tlg0007.tlg002.perseus-grc2"  # Romulus
      - "urn:cts:greekLit:tlg0007.tlg004.perseus-grc2"  # Lycurgus
      - "urn:cts:greekLit:tlg0007.tlg005.perseus-grc2"  # Numa
      - "urn:cts:greekLit:tlg0007.tlg007.perseus-grc2"  # Solon
      - "urn:cts:greekLit:tlg0007.tlg008.perseus-grc2"  # Publicola
      - "urn:cts:greekLit:tlg0007.tlg010.perseus-grc2"  # Themistocles
      - "urn:cts:greekLit:tlg0007.tlg011.perseus-grc2"  # Camillus
      - "urn:cts:greekLit:tlg0007.tlg012.perseus-grc2"  # Pericles
      - "urn:cts:greekLit:tlg0007.tlg013.perseus-grc2"  # Fabius Maximus
      - "urn:cts:greekLit:tlg0007.tlg015.perseus-grc2"  # Alcibiades
      - "urn:cts:greekLit:tlg0007.tlg016.perseus-grc2"  # Gaius Marcius (Coriolanus)
      - "urn:cts:greekLit:tlg0007.tlg018.perseus-grc2"  # Timoleon
      - "urn:cts:greekLit:tlg0007.tlg019.perseus-grc2"  # Aemilius Paullus
      - "urn:cts:greekLit:tlg0007.tlg021.perseus-grc2"  # Pelopidas
      - "urn:cts:greekLit:tlg0007.tlg047.perseus-grc2"  # Alexander

  - author: Aristotle
    gbww_title: On Youth and Old Age, On Life and Death, On Breathing
    reason: >
      One GBWW row combines three short treatises. vocab.perseus.org
      catalogs the first two together as one edition but "On Breathing"
      (De respiratione) as a separate one -- no single alias target can
      match both, so both URNs are pinned directly.
    urns:
      - "urn:cts:greekLit:tlg0086.tlg018.1st1K-grc1"  # De iuventute et senectute, De vita et morte
      - "urn:cts:greekLit:tlg0086.tlg037.1st1K-grc1"  # De respiratione
