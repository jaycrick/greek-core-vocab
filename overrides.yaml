# Manual overrides for match_books.py -- the two rows where a Great
# Books title has no literal match in Perseus's catalog and required a
# human judgment call (see the plan/README for the reasoning), rather
# than the general normalize+substring+comma-component matching
# match_books.py otherwise does on its own.
#
# Keyed by (author, gbww_title); each entry's `urns` list is used
# VERBATIM as that row's matched_urns, bypassing normal matching
# entirely -- match_books.py checks this file first.

overrides:
  - author: Plutarch
    gbww_title: The Lives of the Noble Grecians and Romans
    reason: >
      GBWW's row is a single title for the whole Parallel Lives
      collection; Perseus lists each biography as its own separate
      work (author=Plutarch, translator=Bernadotte Perrin) and has no
      single text literally titled "The Lives of the Noble Grecians
      and Romans". Every Perrin-translated biography is included;
      Perrin's own "Comparison of X and Y" essays and the (Latin-
      titled, Babbitt/Bernardakis-translated) Moralia are excluded --
      neither is part of the Lives themselves.
    urns:
      - "Perseus:text:2008.01.0080"  # Aemilius Paulus
      - "Perseus:text:2008.01.0081"  # Agesilaus
      - "Perseus:text:2008.01.0082"  # Agis
      - "Perseus:text:1999.01.0181"  # Alcibiades
      - "Perseus:text:2008.01.0129"  # Alexander
      - "Perseus:text:2008.01.0077"  # Antony
