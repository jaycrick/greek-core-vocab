  - author: Hippocrates
    gbww_title: __ALL__
    reason: >
      GBWW lists 17 individual Hippocratic treatises (the Oath, On
      Ancient Medicine, Aphorisms, ...); Perseus's Greek vocab tool
      only offers two omnibus editions with no per-treatise selection,
      and none of the 17 titles literally matches either omnibus's
      title. Every one of the 17 rows is treated as pointing at the
      same English-edition omnibus below -- match_books.py fetches and
      counts it ONCE, not 17 times (this is what `gbww_title: __ALL__`
      signals: apply to every great_books.tsv row for this author,
      not one specific title).
    urns:
      - "Perseus:text:1999.01.0249"  # Hippocrates Collected Works I (ed. W. H. S. Jones)
